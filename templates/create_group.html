{{define "content"}}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-sm border border-gray-200">
    <a href="/dashboard" class="text-sm text-indigo-600 hover:underline mb-4 inline-block">&larr; Back to Dashboard</a>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Create an Apartment</h1>

    <form hx-post="/groups" hx-target="#result" class="flex flex-col gap-4 mt-4">
        <input type="text" name="group_name" placeholder="Apartment Name (e.g. The Batcave)" required
            class="px-4 py-2 border rounded focus:ring-2 focus:ring-indigo-500">
        <button type="submit"
            class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded hover:bg-indigo-700">Create Group</button>
    </form>
    <div id="result" class="mt-4"></div>
</div>
{{end}}
