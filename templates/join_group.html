{{define "content"}}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-sm border border-gray-200">
    <a href="/dashboard" class="text-sm text-indigo-600 hover:underline mb-4 inline-block">&larr; Back to Dashboard</a>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Join an Apartment</h1>

    <form hx-post="/groups/join" hx-target="#result" class="flex flex-col gap-4 mt-4">
        <input type="text" name="invite_code" placeholder="6-Character Code" required maxlength="6"
            class="px-4 py-2 border rounded uppercase focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="px-4 py-2 bg-gray-800 text-white font-semibold rounded hover:bg-gray-900">Join
            Group</button>
    </form>
    <div id="result" class="mt-4"></div>
</div>
{{end}}
