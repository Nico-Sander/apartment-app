{{define "content"}}
<div class="max-w-4xl mx-auto mt-10">
    <div class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Welcome back, {{.User.Name}}!</h1>
            <p class="text-sm text-gray-500 font-mono mt-1">ID: {{.User.ID}}</p>
        </div>

        <div class="flex gap-3">
            <a href="/groups/create"
                class="px-4 py-2 bg-indigo-50 text-indigo-700 font-semibold rounded hover:bg-indigo-100 transition border border-indigo-200">
                Create New Apartment Group
            </a>
            <a href="/groups/join"
                class="px-4 py-2 bg-white text-gray-700 font-semibold rounded hover:bg-gray-50 transition border border-gray-300">
                Join Apartment
            </a>
            <button hx-post="/logout"
                class="px-4 py-2 bg-red-50 text-red-600 font-semibold rounded hover:bg-red-100 transition border border-red-200">
                Log Out
            </button>
        </div>
    </div>

    <h2 class="text-xl font-bold text-gray-800 mb-4">Your Apartments</h2>
    {{if .Groups}}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        {{range .Groups}}
        <a href="/group?id={{.ID}}"
            class="block p-6 bg-white rounded-xl shadow-sm border border-gray-200 hover:border-indigo-400 hover:shadow-md transition">
            <h3 class="text-lg font-bold text-indigo-700">{{.Name}}</h3>
            <p class="text-sm text-gray-500 mt-2">Invite Code: <span
                    class="font-mono bg-gray-100 px-1 rounded">{{.InviteCode}}</span></p>
        </a>
        {{end}}
    </div>
    {{else}}
    <div class="p-8 bg-gray-50 rounded-xl border border-dashed border-gray-300 text-center">
        <p class="text-gray-500">You aren't part of any apartments yet.</p>
    </div>
    {{end}}
</div>
{{end}}
